# DS01 Alertmanager Configuration
# Two independent channels per receiver: Teams (msteamsv2_configs) and mail
# (webhook_configs, through the host's dsl-alert-bridge). Either may be unprovisioned;
# a receiver's integrations are notified independently, so one silent channel never
# costs the other. The same shape scripts/maintenance/dsl-alert.sh has.
#
# SETUP — Teams:
#   The Teams webhook URL is read at runtime from the gitignored secret file
#   config/runtime/teams-webhook-url.txt (mounted read-only into the container at
#   /etc/alertmanager/teams-webhook-url.txt). Put the Power Automate (logic.azure.com)
#   workflow URL in that file — it must never be committed (this repo is public).
#   The same file is the single source of truth for ds01-monthly-report.
#
# SETUP — mail:
#   dsl-alert-bridge.service listens on the host and mails through Microsoft Graph;
#   Alertmanager reaches it over host.docker.internal, exactly as Prometheus already
#   scrapes the host's ds01-exporter. The bridge sends mail AS THE LAB, so the POST
#   carries a bearer token from the gitignored config/runtime/alertmanager-mail-token.txt
#   (mounted at /etc/alertmanager/mail-token.txt); the bridge refuses to start without
#   the same file. Provisioning: docs/admin/maintenance.md.
#
# NOTE: Requires Alertmanager v0.28.0+ for msteamsv2_configs + webhook_url_file support.
#   Current image: prom/alertmanager:v0.28.1

global:
  resolve_timeout: 5m

# Alert routing tree
route:
  # Default receiver (all alerts go here unless matched by child route)
  receiver: 'ds01-teams'

  # Group alerts by alertname only (aggressive grouping for batch notifications)
  group_by: ['alertname']

  # Wait 5m before sending first notification (batch related alerts)
  group_wait: 5m

  # Wait 5m before sending updates for existing group
  group_interval: 5m

  # Resend notification every 4h if alert still firing
  repeat_interval: 4h

  # Child routes
  routes:
    # Critical alerts - faster notification path
    - match:
        severity: critical
      receiver: 'ds01-teams-critical'
      group_wait: 30s      # Send critical alerts quickly
      repeat_interval: 1h  # Remind more frequently

# Inhibition rules - suppress alerts when related critical is firing
inhibit_rules:
  # If critical, suppress warning for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

  # If exporter down, suppress all ds01_ alerts
  - source_match:
      alertname: 'DS01ExporterDown'
    target_match_re:
      alertname: 'DS01.*'
    equal: ['job']

# Receivers - each delivers on both channels, Teams and mail
receivers:
  - name: 'ds01-teams'
    msteamsv2_configs:
      - webhook_url_file: '/etc/alertmanager/teams-webhook-url.txt'
        send_resolved: true
        title: '[DS01] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: |
          **Severity:** {{ .CommonLabels.severity }}
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          {{ end }}
    webhook_configs:
      - url: 'http://host.docker.internal:9099/alert'
        send_resolved: true
        # Alertmanager retries a failed webhook; the bridge answers before it mails, so
        # a retry here means the bridge is down, not that Graph was slow.
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/mail-token.txt

  - name: 'ds01-teams-critical'
    msteamsv2_configs:
      - webhook_url_file: '/etc/alertmanager/teams-webhook-url.txt'
        send_resolved: true
        title: '[DS01 CRITICAL] {{ .CommonLabels.alertname }}'
        text: |
          **CRITICAL ALERT**
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          {{ end }}
    webhook_configs:
      - url: 'http://host.docker.internal:9099/alert'
        send_resolved: true
        # Alertmanager retries a failed webhook; the bridge answers before it mails, so
        # a retry here means the bridge is down, not that Graph was slow.
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/mail-token.txt
