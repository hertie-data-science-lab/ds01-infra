name: Deploy

# Tag-gated release of the live runtime via ds01-deploy (staging clone + rsync).
# Fires on a vX.Y.Z tag push, or manual dispatch. The self-hosted runner (which
# must run as datasciencelab) invokes ds01-deploy, which builds + smoke-tests in
# /opt/ds01-staging before publishing to /opt/ds01-infra and auto-rolls-back on
# failure.
#
# Controls (defence in depth):
#   - restrict v* tag creation to admins via a GitHub ruleset
#   - the 'production' environment below can require a reviewer (one-click gate)
#   - narrow sudoers (config/deploy/sudoers.d/ds01-deploy-runner): ds01-deploy only
#   - ds01-deploy validates the --ref format and ancestry of origin/main

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.5.0)'
        required: true

concurrency:
  group: ds01-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Release to prod via ds01-deploy
    runs-on: [self-hosted, linux, gpu]
    # Optional one-click human gate: configure the 'production' environment in
    # repo settings with a required reviewer. Harmless if left unconfigured.
    environment: production
    steps:
      - name: Resolve + validate tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release via ds01-deploy
        run: sudo /usr/local/bin/ds01-deploy --ref "${{ steps.tag.outputs.tag }}"

  # The alarm runs on a HOSTED runner, never on ds01-runner. A deploy fails most often
  # because the box it deploys to is unwell, and an alarm hosted on that box queues
  # behind the job it was meant to report.
  #
  # Tag pushes only: a workflow_dispatch failure has somebody watching it, and a
  # deliberate manual test going red should not file a ticket. A manual SUCCESS still
  # closes the issue, because re-running by hand is how a person confirms the fix.
  alarm:
    name: Report a failed deploy
    needs: deploy
    if: failure() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read  # the failed step's log, for the mail
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/alarm
        with:
          state: failing
          repo: ${{ github.repository }}
          title: Deploy is failing
          note: |
            A release to prod failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Nothing retries it. The live runtime is whatever the last successful
            `ds01-deploy` left behind — check `sudo ds01-deploy --list` on the box before
            assuming the tag is live. This issue closes itself once a deploy succeeds.
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          graph-tenant-id: ${{ secrets.GRAPH_TENANT_ID }}
          graph-client-id: ${{ secrets.GRAPH_CLIENT_ID }}
          graph-client-cert: ${{ secrets.GRAPH_CLIENT_CERT }}
          graph-sender: ${{ secrets.GRAPH_SENDER }}
          alert-to: h.baker@hertie-school.org
          alert-cc: datasciencelab@hertie-school.org

  recovered:
    name: Close the deploy alarm
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/alarm
        with:
          state: recovered
          repo: ${{ github.repository }}
          title: Deploy is failing
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
