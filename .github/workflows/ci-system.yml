name: System CI

on:
  schedule:
    - cron: '0 3 * * 1-6'  # Nightly Mon-Sat 03:00 UTC — light: no GPU allocation
    - cron: '0 3 * * 0'    # Weekly Sunday 03:00 UTC — full: includes GPU tests
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-system
  cancel-in-progress: true

jobs:
  system-tests:
    name: System tests (tiered)
    runs-on: [self-hosted, linux, gpu]
    outputs:
      label: ${{ steps.scope.outputs.label }}
    steps:
      - name: Select scope
        id: scope
        # Nightly Mon-Sat cron -> LIGHT (perms/access/config/lifecycle, no GPU
        # allocation; seconds). Everything else (Sunday cron, workflow_dispatch,
        # workflow_call) -> FULL (adds GPU allocation tests).
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 3 * * 1-6" ]; then
            echo "marker=system and not requires_gpu" >> "$GITHUB_OUTPUT"
            echo "label=light (nightly, no GPU)" >> "$GITHUB_OUTPUT"
          else
            echo "marker=system" >> "$GITHUB_OUTPUT"
            echo "label=full (GPU + system)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run test suite (${{ steps.scope.outputs.label }})
        working-directory: /opt/ds01-infra/tests
        # -o addopts="" clears tests/pytest.ini's default `-m "not system"`, so this
        # actually runs the system (GPU/live-box) tests — the whole point of this
        # job. Without it, plain `pytest .` inherits the ini filter and silently
        # deselects every system test (PR CI on ubuntu already covers not-system).
        run: |
          sudo /home/datasciencelab/anaconda3/bin/python -m pytest . -o addopts="" \
            -m "${{ steps.scope.outputs.marker }}" -v --tb=short

  # The alarm runs on a HOSTED runner, and the step that used to do this inside the job
  # above did not. That step could only run if the self-hosted runner was alive enough to
  # run it — and a dead ds01-runner is the failure mode that matters most here, because a
  # run that never starts never fails, never alarms and waits forever. It also filed a
  # date-stamped title, so nothing ever deduped and nothing ever closed.
  #
  # Scheduled runs only: a workflow_dispatch or workflow_call failure has somebody
  # watching it. A manual SUCCESS still closes the issue, because re-running by hand is
  # how a person confirms the fix.
  alarm:
    name: Report a failed system CI run
    needs: system-tests
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read  # the failed step's log, for the mail
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/alarm
        with:
          state: failing
          repo: ${{ github.repository }}
          title: System CI is failing
          note: |
            The nightly system suite failed or was cancelled (${{ needs.system-tests.outputs.label }}):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            These tests run against the live box, so a failure here is usually the box and
            not the branch. Nothing retries before the next nightly run. This issue closes
            itself once a run succeeds.
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          graph-tenant-id: ${{ secrets.GRAPH_TENANT_ID }}
          graph-client-id: ${{ secrets.GRAPH_CLIENT_ID }}
          graph-client-cert: ${{ secrets.GRAPH_CLIENT_CERT }}
          graph-sender: ${{ secrets.GRAPH_SENDER }}
          alert-to: h.baker@hertie-school.org
          alert-cc: datasciencelab@hertie-school.org

  recovered:
    name: Close the system CI alarm
    needs: system-tests
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/alarm
        with:
          state: recovered
          repo: ${{ github.repository }}
          title: System CI is failing
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
